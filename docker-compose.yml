# AAAC testbed environment (CLAUDE.md §4.2). Owned by M3.
#
# Client containers carry the netem/tbf chain and therefore need NET_ADMIN.
# `netem.sh` exits non-zero if shaping fails to apply, so a client that could not
# be shaped never reaches the load generator (§7.3).
#
# The netem values below MUST match src/aaac/evaluation/testbed/profiles.py --
# tests/test_testbed_profiles.py asserts this. profiles.py is the source of
# truth; these are a mirror, because compose cannot import Python.

name: aaac

x-client-build: &client-build
  context: .
  dockerfile: docker/client.Dockerfile

x-client-common: &client-common
  cap_add:
    - NET_ADMIN
  depends_on:
    - origin
  volumes:
    - ./configs:/app/configs:ro
    - ./results:/app/results
    # The client SDK classifies its own link (C1), so it needs the exported
    # bundle. client.Dockerfile copies only src/, so without this mount every
    # client falls back to MEDIUM and the classifier figures measure nothing.
    - ./models:/app/models:ro
    # The client image bakes the SDK in via `pip install .`, so a fix to
    # src/aaac/client/ does not reach these containers without a rebuild — and a
    # rebuild re-downloads the whole dependency set three times. Mounting the
    # source and putting it first on PYTHONPATH gives the containers the working
    # tree directly, which is what an editable install does on the host.
    - ./src:/app/src:ro
  environment: &client-env
    AAAC_CONFIG: /app/configs/run.yaml
    AAAC_NETEM_IFACE: eth0
    PYTHONPATH: /app/src
    # Downstream is the direction that carries the ~450 KB page, so it is the
    # one that must be shaped. See the header of netem.sh.
    AAAC_NETEM_DIRECTION: ${AAAC_NETEM_DIRECTION:-ingress}

services:
  # --- M1's queue state. Declared here so the environment is complete; M1 owns
  # --- everything that talks to it.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # --- M1: admission service -----------------------------------------------
  # The single writer of the event log (§3.8), so results/ is mounted rw.
  #
  # Note AAAC_CONFIG_PATH, not AAAC_CONFIG: M1's loader and M3's read different
  # variable names for the same file. Recorded as A7 in INTEGRATION-ISSUES.md;
  # both are set here so neither service depends on the other's spelling.
  admission:
    build:
      context: .
      dockerfile: docker/admission.Dockerfile
    depends_on:
      - redis
      - origin
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./results:/app/results
      # Same reason as the client containers: the image bakes the package in via
      # `pip install .`, so a fix to admission/ or common/ does not reach this
      # container without a full rebuild. The A1 payload gate lives here.
      - ./src:/app/src:ro
    environment:
      AAAC_CONFIG_PATH: /app/configs/run.yaml
      AAAC_CONFIG: /app/configs/run.yaml
      PYTHONPATH: /app/src
      AAAC_RESULTS_DIR: /app/results
      AAAC_RUN_ID: ${AAAC_RUN_ID:-dev}
      AAAC_REDIS_URL: redis://redis:6379/0
      AAAC_ORIGIN_URL: http://origin:8002
      AAAC_TOKEN_SECRET: ${AAAC_TOKEN_SECRET:?set AAAC_TOKEN_SECRET (see .env.example)}

  # --- M2: estimator / delivery service -------------------------------------
  delivery:
    build:
      context: .
      dockerfile: docker/delivery.Dockerfile
    depends_on:
      - origin
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
    environment:
      AAAC_CONFIG_PATH: /app/configs/run.yaml
      PYTHONPATH: /app/src
      AAAC_ORIGIN_BASE: http://origin:8002
      AAAC_TOKEN_SECRET: ${AAAC_TOKEN_SECRET:?set AAAC_TOKEN_SECRET (see .env.example)}

  # --- M3: mock origin -----------------------------------------------------
  origin:
    build:
      context: .
      dockerfile: docker/origin.Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./configs:/app/configs:ro
      - ./results:/app/results
    environment:
      AAAC_CONFIG: /app/configs/run.yaml
      AAAC_RESULTS_DIR: /app/results
      AAAC_ORIGIN_HOST: 0.0.0.0
      AAAC_ORIGIN_PORT: "8002"
      # Both services must agree on the run id or their two logs cannot be
      # paired on timestamp. Give every run its own: `make up RUN_ID=s1-aaac`.
      # Leaving it pinned across runs appends them to one file, and the analysis
      # then refuses the log for holding more than one run.
      AAAC_RUN_ID: ${AAAC_RUN_ID:-dev}
      # AAAC_MODE and AAAC_SEED are deliberately NOT set here. M1's loader takes
      # mode and seed from configs/run.yaml and honours no environment override
      # (INTEGRATION-ISSUES.md A8, A10), so passing them to the origin lets the
      # two services run different experiments: the origin stamped
      # ORIGIN_SAMPLE with `none` while the admission service logged `aaac`, and
      # EventLog.single_mode() refused the result. run.yaml governs both.

  # --- M3: throughput reflector for `make verify-testbed` ------------------
  # Unshaped on purpose: it is the reference point the shaped clients measure
  # themselves against.
  iperf:
    build: *client-build
    command: ["iperf3", "--server", "--port", "5201"]

  # --- M3: shaped client containers ----------------------------------------
  client-high:
    <<: *client-common
    build: *client-build
    hostname: client-high
    environment:
      <<: *client-env
      AAAC_NETEM_PROFILE: HIGH
      AAAC_NETEM_RATE: 50mbit
      AAAC_NETEM_DELAY: 15ms
      AAAC_NETEM_JITTER: 3ms
      AAAC_NETEM_LOSS: 0.01%
      AAAC_NETEM_BURST: 256kbit
    command: ["sh", "-c", "netem.sh && sleep infinity"]

  client-medium:
    <<: *client-common
    build: *client-build
    hostname: client-medium
    environment:
      <<: *client-env
      AAAC_NETEM_PROFILE: MEDIUM
      AAAC_NETEM_RATE: 5mbit
      AAAC_NETEM_DELAY: 60ms
      AAAC_NETEM_JITTER: 20ms
      AAAC_NETEM_LOSS: 0.5%
      AAAC_NETEM_BURST: 64kbit
    command: ["sh", "-c", "netem.sh && sleep infinity"]

  client-low:
    <<: *client-common
    build: *client-build
    hostname: client-low
    environment:
      <<: *client-env
      AAAC_NETEM_PROFILE: LOW
      AAAC_NETEM_RATE: 512kbit
      AAAC_NETEM_DELAY: 250ms
      AAAC_NETEM_JITTER: 120ms
      AAAC_NETEM_LOSS: 3%
      AAAC_NETEM_BURST: 32kbit
    command: ["sh", "-c", "netem.sh && sleep infinity"]
